name: Publish.Nuget

on:
  workflow_dispatch:   
  
  push:
    branches:
      - master
  
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.x.x'

      - name: Restore Dependencies
        working-directory: ./src
        run: dotnet restore Loom.Net.slnx

      - name: Build Solution
        working-directory: ./src
        run: dotnet build Loom.Net.slnx -c Release --no-restore

      - name: Run Tests
        working-directory: ./src
        run: dotnet test Loom.Net.slnx -c Release --no-build

      - name: Pack 'Loom.Net.AspNetCore'
        working-directory: ./src
        run: |         
          dotnet pack Loom.Net.AspNetCore/Loom.Net.AspNetCore.csproj \
            --no-build \
            -c Release \
            -o ./dist

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        working-directory: ./src
        run: |
          dotnet nuget push "./dist/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }}  \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate